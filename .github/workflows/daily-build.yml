name: Daily build

on:
  schedule:
    # 04:00 Asia/Karachi. Pakistan is UTC+5 year-round with no DST, so that is
    # 23:00 UTC the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A milestone is ~20 commits, each verified before it lands. That is slow
    # by design, so the job needs real headroom.
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the salvage step below walks back commits, which a
          # shallow clone cannot do.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The agent commits as it works, so its identity must be set before it
      # runs. Authoring as the repo owner is also what makes these count as
      # contributions — github-actions[bot] commits do not.
      - name: Configure git identity
        run: |
          git config user.name "Mahad Khalid Ghafoor"
          git config user.email "mahadghafoor.07@gmail.com"

      - name: Pick today's milestone
        id: task
        run: node scripts/next-task.js

      - name: Stop if the roadmap is finished
        if: steps.task.outputs.found != 'true'
        run: echo "Nothing left to build." && exit 0

      - name: Install Claude Code
        if: steps.task.outputs.found == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Record starting point
        id: base
        if: steps.task.outputs.found == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Implement
        if: steps.task.outputs.found == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LABEL: ${{ steps.task.outputs.label }}
          TASK: ${{ steps.task.outputs.task }}
        run: |
          cat > /tmp/prompt.md <<'INSTRUCTIONS'
          Read CLAUDE.md first, then the `daily-increment` skill in
          .claude/skills/. They hold the conventions for this repo and they are
          not optional.

          Implement exactly the one milestone below — not the next one, not a
          refactor you noticed along the way.

          Decompose it into roughly 20 atomic commits and COMMIT AS YOU GO.
          Run `npm run build` and `npm test` before every single commit; never
          commit with either failing. Do not save the work for one commit at
          the end — if this run is cut short, whatever you have committed is
          what survives.

          Twenty is a target, not a quota. Real commits only: no
          formatting-only changes, no comment touch-ups, no splitting one
          coherent change to inflate the count. Five real commits beat twenty
          padded ones.

          Before your final commit, run /code-review on the day's diff and fix
          what it finds. On any day touching authentication, sessions, or
          user-scoped queries, run /security-review as well.

          Do not edit ROADMAP.md. Do not push, branch, rebase, or amend —
          commit to the current branch and let the workflow push.
          INSTRUCTIONS

          { printf '\n## Milestone: %s\n\n%s\n' "$LABEL" "$TASK"; } >> /tmp/prompt.md

          claude -p "$(cat /tmp/prompt.md)" \
            --permission-mode bypassPermissions \
            --model claude-opus-5 \
            --output-format text

      - name: Verify
        id: verify
        if: steps.task.outputs.found == 'true'
        continue-on-error: true
        run: npm run build && npm test

      - name: Repair
        id: repair
        if: steps.task.outputs.found == 'true' && steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "The build or tests are failing. Run \`npm run build\` and
          \`npm test\`, read the errors, and fix them with the smallest change
          that works. Commit the fix. Do not edit ROADMAP.md, and do not push,
          branch, rebase or amend." \
            --permission-mode bypassPermissions \
            --model claude-opus-5 \
            --output-format text
          npm run build && npm test

      # Rather than throwing away a whole day for one bad commit at the end,
      # walk back one commit at a time until the tree is green again. Whatever
      # was already good still ships.
      - name: Salvage the green commits
        id: salvage
        if: >-
          steps.task.outputs.found == 'true' &&
          steps.verify.outcome == 'failure' &&
          steps.repair.outcome == 'failure'
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          for _ in $(seq 1 10); do
            AHEAD="$(git rev-list --count "$BASE"..HEAD)"
            if [ "$AHEAD" -eq 0 ]; then
              echo "::warning::nothing salvageable — back at the starting commit"
              break
            fi
            if npm run build >/dev/null 2>&1 && npm test >/dev/null 2>&1; then
              echo "::notice::green again with $AHEAD commit(s) kept"
              echo "recovered=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "dropping $(git log -1 --format='%h %s')"
            git reset --hard HEAD~1
          done
          git clean -fd

      - name: Check off the milestone
        if: >-
          steps.task.outputs.found == 'true' &&
          (steps.verify.outcome == 'success' || steps.repair.outcome == 'success')
        run: |
          node scripts/complete-task.js "${{ steps.task.outputs.line }}"
          git add ROADMAP.md
          git commit -m "Mark ${{ steps.task.outputs.label }} complete"

      - name: Push
        id: push
        if: steps.task.outputs.found == 'true'
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          COUNT="$(git rev-list --count "$BASE"..HEAD)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::no commits produced today"
            exit 0
          fi
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ steps.task.outputs.label }}"
            echo
            echo "**$COUNT commits**"
            echo
            git log --format='- `%h` %s' "$BASE"..HEAD
          } >> "$GITHUB_STEP_SUMMARY"
          git push

      - name: Deploy to Vercel
        id: deploy
        continue-on-error: true
        if: steps.task.outputs.found == 'true' && steps.push.outputs.commits != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping deploy"
            exit 0
          fi
          npm i -g vercel@latest >/dev/null 2>&1
          # The CLI prints a JSON envelope, not a bare URL, so scrape the
          # hostname rather than trusting the last line.
          OUT="$(vercel deploy --prod --yes \
                   --project keel \
                   --scope mahad-khalid-ghafoors-projects \
                   --token "$VERCEL_TOKEN" 2>&1)"
          echo "$OUT" | tail -20
          HOST="$(printf '%s' "$OUT" | grep -oE '[a-z0-9-]+\.vercel\.app' | head -1)"
          if [ -n "$HOST" ]; then
            echo "::notice::deployed https://$HOST"
            echo "Deployed: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::vercel returned no deployment URL"
            exit 1
          fi

      - name: Report a failed milestone
        if: >-
          steps.task.outputs.found == 'true' &&
          steps.verify.outcome == 'failure' &&
          steps.repair.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.task.outputs.label }}
        run: |
          gh issue create \
            --title "Milestone left unfinished: $LABEL" \
            --label "build-failure" \
            --body "The run could not get \`$LABEL\` to a green build. Commits that were already green have been kept and pushed; the rest were dropped. The milestone stays unchecked, so the next run retries it.

          [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      # Only fires when the job itself dies — expired token, exhausted quota,
      # infrastructure. Without it those failures are silent.
      - name: Report an aborted run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Daily build aborted — $(date -u +%Y-%m-%d)" \
            --label "build-failure" \
            --body "The daily run did not finish. This is not a failing test — the job itself stopped, so the usual causes are an expired \`CLAUDE_CODE_OAUTH_TOKEN\`, exhausted Claude quota, or an infrastructure blip.

          The roadmap is untouched, so the next run retries the same milestone. If the token has expired, run \`claude setup-token\` and update the secret.

          [Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
